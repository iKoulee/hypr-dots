# Přezdívky audio zařízení pro hypr-audio-menu.
#
# Formát: glob|ikona|název
#   glob   – porovnává se s PipeWire `node.name` (viz `wpctl status`
#            nebo `pw-dump | jq -r '.[].info.props."node.name"'`)
#   ikona  – znak z JetBrainsMono Nerd Font
#   název  – co se zobrazí v menu
#
# První řádek, který sedí, vyhrává. Nenamatchované zařízení se zobrazí
# s vlastním `node.description` a generickou ikonou.

*Logitech_G733*|| Sluchátka G733
*hdmi*|| HDMI monitor
*analog-surround*|| Repro 5.1
*USB_Audio*|| USB mikrofon
