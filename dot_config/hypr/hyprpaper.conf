# hyprpaper 0.8+ používá blokovou syntaxi (hyprlang special category).
# Starý formát `preload = …` + `wallpaper = MONITOR, cesta` se tiše ignoruje —
# projeví se to hláškou "Monitor DP-2 has no target: no wp will be created".
wallpaper {
    monitor = DP-2
    path = ~/.local/share/wallpapers/cyberpunk_2077_ultimate_edition_video_game_valerie-wallpaper-5120x1440.jpg
    fit_mode = cover
}
