# Odebírá gnome-keyringu komponentu "secrets", aby org.freedesktop.secrets mohl
# převzít KeePassXC. pkcs11 zůstává — na něm jede certifikátové úložiště.
# Prázdný ExecStart= je povinný reset, jinak by se druhý řádek jen přidal.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-keyring-daemon --foreground --components=pkcs11 --control-directory=%t/keyring
